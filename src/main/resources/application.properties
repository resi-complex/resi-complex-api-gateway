spring.application.name=api-gateway
# Default port 8090 in local dev to avoid port 8080 conflict with Windows AgentService (override via SERVER_PORT=8080 in Docker)
server.port=${SERVER_PORT:8090}

# JWT Verification (shared secret with iam-service per ADR-006):
gateway.jwt.secret=${JWT_SECRET:resicomplex-local-dev-hs256-signing-secret-key-at-least-256-bits-long-2026}
gateway.rate-limit.requests-per-minute=${GATEWAY_RPM_LIMIT:240}

# Downstream Microservice Base URLs (9 Bounded Contexts):
gateway.routes.iam=${IAM_SERVICE_URL:http://localhost:8081}
gateway.routes.communications=${COMMUNICATIONS_SERVICE_URL:http://localhost:8082}
gateway.routes.people=${PEOPLE_SERVICE_URL:http://localhost:8083}
gateway.routes.billing=${BILLING_SERVICE_URL:http://localhost:8084}
gateway.routes.units=${UNITS_SERVICE_URL:http://localhost:8085}
gateway.routes.maintenance=${MAINTENANCE_SERVICE_URL:http://localhost:8086}
gateway.routes.access-control=${ACCESS_CONTROL_SERVICE_URL:http://localhost:8087}
gateway.routes.finance-approval=${FINANCE_APPROVAL_SERVICE_URL:http://localhost:8088}
gateway.routes.reports=${REPORTS_SERVICE_URL:http://localhost:8089}
